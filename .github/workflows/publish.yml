# Publishes a release tag: builds the binaries and attaches them to the GitHub
# Release. It lives in its own workflow file because two things reach it:
# release.yml calls it (workflow_call) with the tag release-please just cut,
# and a maintainer dispatches it by hand to re-publish a tag. The tag's own
# tree must contain install.sh, which rules out v0.1.0.
#
# - checks out the tag and re-runs the checks there, so a release is built from
#   the exact tree that was tagged, never from a moving branch.
# - assets have no version in their names (quet_<os>_<arch>, SHA256SUMS,
#   install.sh), so /releases/latest/download/<asset> always resolves to the
#   newest release — that is the URL install.sh and the docs use.
# - `--clobber` makes re-running safe: the assets are replaced, not duplicated.
#   A dispatched tag with no GitHub Release yet gets one created first.
# - one publish per tag at a time, never cancelled mid-upload.
#
# One-time setup: none beyond release.yml's — GITHUB_TOKEN uploads the assets.
name: Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, for example v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to re-publish, for example v0.2.0
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Before checkout: a bad tag is the one failure worth naming, and the
      # version every later step uses is derived from it.
      - name: Validate tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must look like v1.2.3, got '$TAG'"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make check
      - run: make release VERSION=${{ steps.tag.outputs.version }}

      # The linux/amd64 binary runs on this runner: prove the stamp is right
      # before anything is uploaded.
      - name: Check version stamp
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          got=$(./dist/quet_linux_amd64 --version)
          echo "$got"
          case "$got" in
            "quet $VERSION "*) ;;
            *) echo "::error::binary reports '$got', want quet $VERSION"; exit 1 ;;
          esac

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "See CHANGELOG.md for what changed."
          fi
          gh release upload "$TAG" dist/quet_* dist/SHA256SUMS install.sh --clobber
